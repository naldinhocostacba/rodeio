<Viewbox xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
         xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
         Width="1920" Height="1080">
    <Canvas Width="1920" Height="1080">
        
        <!-- Caixa de Fundo do Placar (Inferior Esquerdo) -->
        <Border Canvas.Left="100" Canvas.Top="850" Width="1720" Height="160" Background="#99000000" CornerRadius="12" BorderBrush="#D4A373" BorderThickness="4">
            <Grid>
                <Grid.ColumnDefinitions>
                    <ColumnWidth>400</ColumnWidth>
                    <ColumnWidth>400</ColumnWidth>
                    <ColumnWidth>350</ColumnWidth>
                    <ColumnWidth>300</ColumnWidth>
                    <ColumnWidth>*</ColumnWidth>
                </Grid.ColumnDefinitions>

                <!-- Coluna 1: Nome do Competidor -->
                <StackPanel Grid.Column="0" VerticalAlignment="Center" Margin="20,0,0,0">
                    <TextBlock Text="COMPETIDOR" FontSize="18" Foreground="#D4A373" FontWeight="Bold"/>
                    <TextBlock x:Name="txtNome" Text="Nome do Peão" FontSize="32" Foreground="White" FontWeight="Bold"/>
                    <TextBlock x:Name="txtCidade" Text="Cidade - UF" FontSize="16" Foreground="#CCCCCC"/>
                </StackPanel>

                <!-- Coluna 2: Animal e Empresa -->
                <StackPanel Grid.Column="1" VerticalAlignment="Center" Margin="10,0,0,0">
                    <TextBlock Text="ANIMAL / TROPA" FontSize="18" Foreground="#D4A373" FontWeight="Bold"/>
                    <TextBlock x:Name="txtAnimal" Text="Nome do Touro" FontSize="26" Foreground="White" FontWeight="Bold"/>
                    <TextBlock x:Name="txtEmpresa" Text="Cia. de Rodeio" FontSize="16" Foreground="#CCCCCC"/>
                </StackPanel>

                <!-- Coluna 3: Nota Total -->
                <StackPanel Grid.Column="2" VerticalAlignment="Center" HorizontalAlignment="Center">
                    <TextBlock Text="NOTA TOTAL" FontSize="18" Foreground="#D4A373" FontWeight="Bold" HorizontalAlignment="Center"/>
                    <TextBlock x:Name="txtNotaTotal" Text="0.0" FontSize="45" Foreground="#2B9348" FontWeight="Bold" HorizontalAlignment="Center"/>
                </StackPanel>

                <!-- Coluna 4: Cronômetro -->
                <StackPanel Grid.Column="3" VerticalAlignment="Center" HorizontalAlignment="Center">
                    <TextBlock Text="TEMPO" FontSize="18" Foreground="#D4A373" FontWeight="Bold" HorizontalAlignment="Center"/>
                    <TextBlock x:Name="txtCronometro" Text="00:00.0" FontSize="45" Foreground="#00FF00" FontFamily="Consolas" FontWeight="Bold" HorizontalAlignment="Center"/>
                </StackPanel>

                <!-- Coluna 5: Status / Bandeira -->
                <StackPanel Grid.Column="4" VerticalAlignment="Center" HorizontalAlignment="Center">
                    <TextBlock Text="STATUS" FontSize="18" Foreground="#D4A373" FontWeight="Bold" HorizontalAlignment="Center"/>
                    <TextBlock x:Name="txtBandeira" Text="VERDE" FontSize="30" Foreground="White" FontWeight="Bold" HorizontalAlignment="Center"/>
                </StackPanel>

            </Grid>
        </Border>

    </Canvas>
</Viewbox>
